<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 850 200" width="100%" height="100%">
  <defs>
    <!-- Matrix Code Pattern -->
    <pattern id="matrix-code" width="40" height="20" patternUnits="userSpaceOnUse">
      <text x="10" y="12" fill="#00FF66" fill-opacity="0.07" font-size="9" font-family="monospace">01</text>
      <text x="25" y="18" fill="#38BDF8" fill-opacity="0.07" font-size="8" font-family="monospace">FF</text>
    </pattern>

    <linearGradient id="btn-portfolio" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#052E16"/>
      <stop offset="100%" stop-color="#022C22"/>
    </linearGradient>

    <linearGradient id="btn-linkedin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0C4A6E"/>
      <stop offset="100%" stop-color="#075985"/>
    </linearGradient>

    <linearGradient id="btn-email" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#311042"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>

    <filter id="cyber-glow-btn" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes link-pulse {
      0%, 100% { stroke-opacity: 0.5; }
      50% { stroke-opacity: 1; }
    }
    .font-mono { font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, monospace; }
    .btn-link { cursor: pointer; transition: transform 0.25s ease; }
    .btn-link:hover { transform: translateY(-3px); }
    .pulse-stroke { animation: link-pulse 2s infinite; }
  </style>

  <!-- Frame Background -->
  <rect x="5" y="5" width="840" height="190" rx="12" fill="#0B0F19" stroke="#1E293B" stroke-width="1.5"/>
  <rect x="5" y="5" width="840" height="190" rx="12" fill="url(#matrix-code)"/>

  <!-- Terminal Header -->
  <path d="M 5 5 L 845 5 L 845 36 L 5 36 Z" fill="#161B22" opacity="0.85"/>
  <line x1="5" y1="36" x2="845" y2="36" stroke="#30363D" stroke-width="1"/>
  
  <text x="30" y="24" fill="#00FF66" font-size="11.5" font-weight="700" class="font-mono">
    // ESTABLISH_SECURE_UPLINK :: CHANNELS_OPEN
  </text>
  <text x="690" y="24" fill="#8B949E" font-size="10.5" class="font-mono">PROTOCOL: TLS 1.3</text>

  <!-- Interactive Terminal Action Buttons -->
  <g transform="translate(30, 56)">
    <!-- Button 1: Portfolio -->
    <a href="https://umairs759.github.io/Muhammad-Umair-Portfolio/" target="_blank" class="btn-link">
      <g transform="translate(0, 0)">
        <rect class="pulse-stroke" width="245" height="85" rx="8" fill="url(#btn-portfolio)" stroke="#00FF66" stroke-width="1.2"/>
        <!-- Globe Icon -->
        <circle cx="36" cy="36" r="14" fill="none" stroke="#00FF66" stroke-width="1.4"/>
        <line x1="22" y1="36" x2="50" y2="36" stroke="#00FF66" stroke-width="1"/>
        <ellipse cx="36" cy="36" rx="7" ry="14" fill="none" stroke="#00FF66" stroke-width="1"/>
        
        <text x="62" y="32" fill="#00FF66" font-size="12.5" font-weight="700" class="font-mono">PORTFOLIO PORTAL</text>
        <text x="62" y="48" fill="#94A3B8" font-size="9" class="font-mono">umairs759.github.io</text>
        <text x="24" y="70" fill="#34D399" font-size="8.5" font-weight="600" class="font-mono">&gt; ACCESS_DEV_LOGS</text>
      </g>
    </a>

    <!-- Button 2: LinkedIn -->
    <a href="https://linkedin.com/in/umairs759" target="_blank" class="btn-link">
      <g transform="translate(267, 0)">
        <rect class="pulse-stroke" width="245" height="85" rx="8" fill="url(#btn-linkedin)" stroke="#38BDF8" stroke-width="1.2"/>
        <!-- LinkedIn Icon -->
        <rect x="24" y="23" width="25" height="25" rx="4" fill="none" stroke="#38BDF8" stroke-width="1.4"/>
        <text x="32" y="41" fill="#38BDF8" font-size="13" font-weight="900" class="font-mono">in</text>
        
        <text x="62" y="32" fill="#38BDF8" font-size="12.5" font-weight="700" class="font-mono">LINKEDIN NETWORK</text>
        <text x="62" y="48" fill="#94A3B8" font-size="9" class="font-mono">/in/umairs759</text>
        <text x="24" y="70" fill="#7DD3FC" font-size="8.5" font-weight="600" class="font-mono">&gt; CONNECT_DISPATCH</text>
      </g>
    </a>

    <!-- Button 3: Encrypted Email -->
    <a href="mailto:umairghaffar759@gmail.com" target="_blank" class="btn-link">
      <g transform="translate(535, 0)">
        <rect class="pulse-stroke" width="245" height="85" rx="8" fill="url(#btn-email)" stroke="#A855F7" stroke-width="1.2"/>
        <!-- Mail Icon -->
        <rect x="24" y="26" width="26" height="18" rx="2" fill="none" stroke="#A855F7" stroke-width="1.4"/>
        <polyline points="24,26 37,36 50,26" fill="none" stroke="#A855F7" stroke-width="1.4"/>
        
        <text x="62" y="32" fill="#C084FC" font-size="12.5" font-weight="700" class="font-mono">DIRECT INBOX</text>
        <text x="62" y="48" fill="#94A3B8" font-size="9" class="font-mono">umairghaffar759@...</text>
        <text x="24" y="70" fill="#E879F9" font-size="8.5" font-weight="600" class="font-mono">&gt; TRANSMIT_PAYLOAD</text>
      </g>
    </a>
  </g>

  <!-- Bottom Verification Footer -->
  <line x1="30" y1="165" x2="820" y2="165" stroke="#1E293B" stroke-width="0.8"/>
  <text x="425" y="180" fill="#64748B" font-size="10" text-anchor="middle" class="font-mono">
    GPG KEY: VERIFIED // MUHAMMAD UMAIR // UNIVERSITY OF CENTRAL PUNJAB // LAHORE, PK
  </text>
</svg>
