<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 280" width="100%" height="100%">
  <defs>
    <!-- Grid Pattern -->
    <pattern id="cyber-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#1E293B" stroke-width="0.8" stroke-opacity="0.35"/>
    </pattern>

    <!-- Neon Glow Filter -->
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Linear Gradients -->
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00FF66"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0078D4"/>
    </linearGradient>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0D1117"/>
      <stop offset="100%" stop-color="#0B0F19"/>
    </linearGradient>

    <linearGradient id="scanline-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <style>
    @keyframes scanline {
      0% { transform: translateY(-50px); }
      100% { transform: translateY(330px); }
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.2; }
    }
    @keyframes pulse-dot {
      0% { r: 3.5px; opacity: 1; }
      50% { r: 5.5px; opacity: 0.4; }
      100% { r: 3.5px; opacity: 1; }
    }
    @keyframes role-cycle-1 {
      0%, 25% { opacity: 1; transform: translateY(0); }
      30%, 100% { opacity: 0; transform: translateY(-8px); }
    }
    @keyframes role-cycle-2 {
      0%, 28% { opacity: 0; transform: translateY(8px); }
      33%, 58% { opacity: 1; transform: translateY(0); }
      63%, 100% { opacity: 0; transform: translateY(-8px); }
    }
    @keyframes role-cycle-3 {
      0%, 61% { opacity: 0; transform: translateY(8px); }
      66%, 93% { opacity: 1; transform: translateY(0); }
      98%, 100% { opacity: 0; transform: translateY(-8px); }
    }

    .font-mono { font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, monospace; }
    .scanner { animation: scanline 4.5s ease-in-out infinite; }
    .rec-pulse { animation: pulse-dot 1.8s infinite; }
    .sys-blink { animation: blink 1.2s infinite; }
    .role-1 { animation: role-cycle-1 10s infinite; }
    .role-2 { animation: role-cycle-2 10s infinite; }
    .role-3 { animation: role-cycle-3 10s infinite; }
  </style>

  <!-- Terminal Frame -->
  <rect x="5" y="5" width="840" height="270" rx="12" fill="url(#card-grad)" stroke="#1E293B" stroke-width="1.5"/>
  <rect x="5" y="5" width="840" height="270" rx="12" fill="url(#cyber-grid)"/>

  <!-- Scanning Beam -->
  <rect class="scanner" x="6" y="0" width="838" height="40" fill="url(#scanline-grad)" pointer-events="none"/>

  <!-- Window Header -->
  <path d="M 5 5 L 845 5 C 848 5, 845 10, 845 42 L 5 42 Z" fill="#161B22" opacity="0.9"/>
  <line x1="5" y1="42" x2="845" y2="42" stroke="#30363D" stroke-width="1"/>

  <!-- Window Controls -->
  <circle cx="28" cy="24" r="5.5" fill="#EF4444"/>
  <circle cx="46" cy="24" r="5.5" fill="#F59E0B"/>
  <circle cx="64" cy="24" r="5.5" fill="#10B981"/>

  <text x="88" y="28" fill="#8B949E" font-size="12" class="font-mono">root@umairs759:~# ./sys_kernel_init.sh</text>

  <!-- Live Status Badges -->
  <g transform="translate(620, 16)">
    <rect width="100" height="18" rx="9" fill="#052E16" stroke="#00FF66" stroke-width="0.8" stroke-opacity="0.5"/>
    <circle class="rec-pulse" cx="12" cy="9" r="4" fill="#00FF66"/>
    <text x="24" y="13" fill="#00FF66" font-size="9.5" font-weight="700" class="font-mono">SYS_ONLINE</text>
  </g>
  <g transform="translate(732, 16)">
    <rect width="95" height="18" rx="9" fill="#1E1B4B" stroke="#38BDF8" stroke-width="0.8" stroke-opacity="0.5"/>
    <circle class="sys-blink" cx="12" cy="9" r="3.5" fill="#38BDF8"/>
    <text x="22" y="13" fill="#38BDF8" font-size="9.5" font-weight="700" class="font-mono">ENC: AES-256</text>
  </g>

  <!-- Hero Content -->
  <!-- Target Crosshair Left -->
  <g transform="translate(45, 80)" stroke="#38BDF8" stroke-opacity="0.35" stroke-width="1.2">
    <circle cx="25" cy="25" r="18" fill="none"/>
    <circle cx="25" cy="25" r="8" fill="none"/>
    <line x1="25" y1="2" x2="25" y2="48"/>
    <line x1="2" y1="25" x2="48" y2="25"/>
  </g>

  <!-- Identity Block -->
  <text x="120" y="92" fill="#38BDF8" font-size="12" font-weight="600" letter-spacing="2" class="font-mono">IDENT_HANDLE: [umairs759] // LAHORE, PK</text>
  
  <text x="120" y="142" fill="url(#text-grad)" font-size="38" font-weight="800" letter-spacing="1.5" class="font-mono" filter="url(#neon-glow)">
    MUHAMMAD UMAIR
  </text>

  <!-- Cycling Subtitle Roles -->
  <g transform="translate(120, 178)">
    <text class="font-mono role-1" fill="#00FF66" font-size="14.5" font-weight="600">
      &gt; CYBERSECURITY UNDERGRADUATE @ UCP // OFFSEC &amp; PENETRATION DEFENSE
    </text>
    <text class="font-mono role-2" fill="#38BDF8" font-size="14.5" font-weight="600">
      &gt; MICROSOFT LEARN STUDENT AMBASSADOR // CLOUD ARCHITECTURE &amp; AZURE
    </text>
    <text class="font-mono role-3" fill="#A855F7" font-size="14.5" font-weight="600">
      &gt; AUTONOMOUS SYSTEMS BUILDER // FASTAPI &amp; EDGE AI THREAT AUTOMATION
    </text>
  </g>

  <!-- Bottom Telemetry HUD Line -->
  <line x1="30" y1="225" x2="820" y2="225" stroke="#1E293B" stroke-width="1"/>
  
  <g transform="translate(30, 248)" class="font-mono" font-size="11" fill="#8B949E">
    <text x="0" y="0">PORT: <tspan fill="#00FF66">ETH0::443</tspan></text>
    <text x="150" y="0">DEFENSE CORE: <tspan fill="#38BDF8">ACTIVE VULN MONITOR</tspan></text>
    <text x="430" y="0">ORGANIZATION: <tspan fill="#F1F5F9">UNIVERSITY OF CENTRAL PUNJAB</tspan></text>
    <text x="735" y="0">NODE: <tspan fill="#00FF66">#625350</tspan></text>
  </g>

  <!-- Corner Brackets -->
  <path d="M 12 18 L 12 12 L 18 12" stroke="#00FF66" stroke-width="1.8" fill="none"/>
  <path d="M 838 18 L 838 12 L 832 12" stroke="#00FF66" stroke-width="1.8" fill="none"/>
  <path d="M 12 262 L 12 268 L 18 268" stroke="#00FF66" stroke-width="1.8" fill="none"/>
  <path d="M 838 262 L 838 268 L 832 268" stroke="#00FF66" stroke-width="1.8" fill="none"/>
</svg>
