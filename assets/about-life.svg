<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 340" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#1E293B" fill-opacity="0.6"/>
    </pattern>

    <linearGradient id="panel-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D1117"/>
      <stop offset="100%" stop-color="#0B0F19"/>
    </linearGradient>

    <!-- Radar Sweep Gradient -->
    <linearGradient id="sweep-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FF66" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#00FF66" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#00FF66" stop-opacity="0"/>
    </linearGradient>

    <filter id="badge-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes radar-spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes ping-blip {
      0% { opacity: 0; r: 1.5px; }
      40% { opacity: 1; r: 4px; }
      80% { opacity: 0; r: 9px; }
      100% { opacity: 0; }
    }
    @keyframes telemetry-wave {
      0%, 100% { height: 6px; }
      50% { height: 18px; }
    }

    .font-mono { font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, monospace; }
    .radar-beam { transform-origin: 720px 175px; animation: radar-spin 4s linear infinite; }
    .ping-1 { animation: ping-blip 3s ease-out infinite; }
    .ping-2 { animation: ping-blip 3s 1.5s ease-out infinite; }
  </style>

  <!-- Frame Background -->
  <rect x="5" y="5" width="840" height="330" rx="12" fill="url(#panel-grad)" stroke="#1E293B" stroke-width="1.5"/>
  <rect x="5" y="5" width="840" height="330" rx="12" fill="url(#dot-grid)"/>

  <!-- Header Header Line -->
  <path d="M 5 5 L 845 5 L 845 40 L 5 40 Z" fill="#161B22" opacity="0.8"/>
  <line x1="5" y1="40" x2="845" y2="40" stroke="#30363D" stroke-width="1"/>

  <text x="30" y="26" fill="#00FF66" font-size="12" font-weight="700" letter-spacing="1" class="font-mono">
    &gt; SYSTEM_DOSSIER // CONFIDENTIAL [ID: UMAIR-0x759]
  </text>
  <text x="710" y="26" fill="#8B949E" font-size="11" class="font-mono">LOC: 31.5204° N, 74.3587° E</text>

  <!-- Dossier Left Column (Personal Specs) -->
  <g transform="translate(30, 68)" class="font-mono">
    <!-- Spec Row 1 -->
    <text x="0" y="15" fill="#38BDF8" font-size="12" font-weight="700">[OPERATOR]</text>
    <text x="140" y="15" fill="#F8FAFC" font-size="12" font-weight="600">Muhammad Umair</text>
    <text x="310" y="15" fill="#8B949E" font-size="11">// Alias: umairs759</text>

    <!-- Spec Row 2 -->
    <text x="0" y="45" fill="#38BDF8" font-size="12" font-weight="700">[FORMATION]</text>
    <text x="140" y="45" fill="#F8FAFC" font-size="12" font-weight="500">BS Cyber Security</text>
    <text x="310" y="45" fill="#00FF66" font-size="11">@ Univ. of Central Punjab (UCP)</text>

    <!-- Spec Row 3 -->
    <text x="0" y="75" fill="#38BDF8" font-size="12" font-weight="700">[CREDENTIAL]</text>
    <text x="140" y="75" fill="#0078D4" font-size="12" font-weight="700" filter="url(#badge-glow)">Microsoft Learn Student Ambassador</text>

    <!-- Spec Row 4 -->
    <text x="0" y="105" fill="#38BDF8" font-size="12" font-weight="700">[DOMAIN FOCUS]</text>
    <text x="140" y="105" fill="#F8FAFC" font-size="12">OffSec, Threat Surface Modeling, Cloud Defense</text>

    <!-- Spec Row 5 -->
    <text x="0" y="135" fill="#38BDF8" font-size="12" font-weight="700">[INFRA &amp; AI]</text>
    <text x="140" y="135" fill="#F8FAFC" font-size="12">Linux Kernels, FastAPI, Docker, Groq LPU, Ollama</text>

    <!-- Spec Row 6 -->
    <text x="0" y="165" fill="#38BDF8" font-size="12" font-weight="700">[SECURITY CLEAR]</text>
    <text x="140" y="165" fill="#10B981" font-size="12" font-weight="600">Level 4 // Threat Simulation &amp; Vulnerability Audit</text>

    <!-- Separator -->
    <line x1="0" y1="190" x2="560" y2="190" stroke="#1E293B" stroke-width="1"/>

    <!-- Operational Quote / Bio -->
    <text x="0" y="215" fill="#94A3B8" font-size="11.5" font-style="italic">
      "Architecting proactive Linux security pipelines, cloud containment telemetry, and
    </text>
    <text x="0" y="235" fill="#94A3B8" font-size="11.5" font-style="italic">
      high-throughput autonomous agents powered by LLMs &amp; resilient backend systems."
    </text>
  </g>

  <!-- Right Column: Live Radar Scope -->
  <g transform="translate(615, 65)">
    <!-- Radar Box Frame -->
    <rect width="210" height="250" rx="8" fill="#0D1117" stroke="#1E293B" stroke-width="1"/>
    <text x="12" y="20" fill="#00FF66" font-size="10.5" font-weight="700" class="font-mono">&gt; GEO_RADAR::LHR</text>

    <!-- Radar Concentric Rings (Center at 105, 125) -->
    <circle cx="105" cy="125" r="75" fill="#052E16" fill-opacity="0.15" stroke="#00FF66" stroke-width="1" stroke-opacity="0.3"/>
    <circle cx="105" cy="125" r="50" fill="none" stroke="#00FF66" stroke-width="0.8" stroke-opacity="0.25"/>
    <circle cx="105" cy="125" r="25" fill="none" stroke="#00FF66" stroke-width="0.8" stroke-opacity="0.25"/>
    <circle cx="105" cy="125" r="2" fill="#00FF66"/>

    <!-- Radar Axes -->
    <line x1="105" y1="50" x2="105" y2="200" stroke="#00FF66" stroke-width="0.8" stroke-opacity="0.25" stroke-dasharray="2 3"/>
    <line x1="30" y1="125" x2="180" y2="125" stroke="#00FF66" stroke-width="0.8" stroke-opacity="0.25" stroke-dasharray="2 3"/>

    <!-- Radar Sweep Beam (SMIL & CSS) -->
    <g class="radar-beam" style="transform-origin: 105px 125px;">
      <path d="M 105 125 L 180 125 A 75 75 0 0 0 158 72 Z" fill="url(#sweep-grad)"/>
      <line x1="105" y1="125" x2="180" y2="125" stroke="#00FF66" stroke-width="1.5" stroke-opacity="0.8"/>
    </g>

    <!-- Radar Blips -->
    <circle class="ping-1" cx="140" cy="95" r="3" fill="#00FF66"/>
    <circle class="ping-2" cx="80" cy="155" r="3" fill="#38BDF8"/>

    <!-- Radar Readouts -->
    <text x="15" y="222" fill="#8B949E" font-size="9.5" class="font-mono">PING: <tspan fill="#00FF66">14ms</tspan></text>
    <text x="95" y="222" fill="#8B949E" font-size="9.5" class="font-mono">PACKETS: <tspan fill="#38BDF8">0% LOSS</tspan></text>
    <text x="15" y="238" fill="#8B949E" font-size="9.5" class="font-mono">STATUS: <tspan fill="#00FF66">SEC_GUARD_ACTIVE</tspan></text>
  </g>
</svg>
