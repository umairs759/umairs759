name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *" # Har 12 ghante baad automatic update hoga
  workflow_dispatch:      # Manually run karne ke liye
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-dark&color_snake=00FF66
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=00FF66
            
      - uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
