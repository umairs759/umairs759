name: Generate Cyber Snake & 3D Intelligence Matrix

on:
  schedule:
    # Har 12 ghante baad auto-sync
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-cyber-telemetry:
    name: Build Cyber Assets & 3D Graph
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Initialize Repository
        uses: actions/checkout@v4

      # 1. 3D Isometric Contribution Graph
      - name: Render 3D Isometric Commits
        uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      # 2. Cyber Snake Animation (Fixed Theme Parameters)
      - name: Generate Cyber Matrix Snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?color_snake=#00FF66&color_dots=#0D1117,#033a16,#026b28,#00b043,#00FF66
            dist/github-contribution-grid-snake.gif?color_snake=#00FF66&color_dots=#0D1117,#033a16,#026b28,#00b043,#00FF66

      # 3. Merge Visual Artifacts
      - name: Merge Visual Artifacts
        run: |
          mkdir -p dist
          sudo chown -R $USER:$USER dist 2>/dev/null || true
          if [ -d "profile-3d-contrib" ]; then
            cp -r profile-3d-contrib/* dist/
          fi

      # 4. Deploy to output branch (Updated to v4)
      - name: Deploy Telemetry to Output Branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
